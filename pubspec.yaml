name: daram
description: "DARAM — AI-first personal finance assistant for Iranian users."
publish_to: 'none'
version: 1.6.1+14

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.1.3

  # Local database
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.0

  # Networking
  dio: ^5.11.1

  # Persistence of settings / credentials
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Persian calendar & formatting
  shamsi_date: ^1.1.1
  intl: ^0.20.3

  # UI
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.12
  lucide_icons_flutter: ^4.0.2
  flutter_svg: ^2.3.2

  # Export / backup
  csv: ^8.0.0
  pdf: ^3.13.1
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.13
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  path: ^1.9.1

  # Misc
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.16.0

  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/ai/
    - assets/ai/tools/
    - assets/ai/examples/
    - assets/banks/
    - assets/flags/
    - assets/crypto/
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024.png"
  adaptive_icon_background: "#6D6AF6"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/images/app_icon_1024.png"
    background_color: "#070B13"
    theme_color: "#0B0F19"
