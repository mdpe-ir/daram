<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="دارام — دستیار مالی هوشمند برای کاربران ایرانی. مدیریت پول با گفتگو، محلی و خصوصی.">
  <meta name="theme-color" content="#070B13">
  <meta name="color-scheme" content="dark light">

  <!-- iOS / PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دارام">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>دارام | دستیار مالی هوشمند</title>

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #070B13;
      color: #F3F5FA;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 32%, #1C1A45 0%, #070B13 62%);
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 24px;
      z-index: 9999;
    }
    #boot-loader img {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      box-shadow: 0 18px 44px rgba(109, 106, 246, 0.35);
    }
    #boot-loader h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    #boot-loader p {
      margin: 0;
      color: #94A3B8;
      font-size: 13px;
    }
    #boot-loader .bar {
      width: 128px;
      height: 3px;
      margin-top: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    #boot-loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #6D6AF6, #A78BFA);
      animation: daram-slide 1.4s ease-in-out infinite;
    }
    @keyframes daram-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-loader .bar::after { animation: none; width: 100%; }
    }
    noscript { color: #94A3B8; padding: 32px; display: block; }
  </style>
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite" aria-label="در حال بارگذاری دارام">
    <img src="icons/Icon-192.png" alt="نشان دارام">
    <h1>دارام</h1>
    <p>پولت رو بشناس، هوشمندانه زندگی کن.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <noscript>برای استفاده از دارام در مرورگر، جاوااسکریپت را فعال کن.</noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
